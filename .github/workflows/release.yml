name: Release APK

# Tag a release (git tag v0.9.0 && git push --tags) or run manually. Builds a signed release APK
# and attaches it to a GitHub Release, which is how dogfood builds are distributed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check signing secrets are present
        env:
          HAVE_KEYSTORE: ${{ secrets.SNIB_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAVE_KEYSTORE" != "true" ]; then
            echo "::error::Release signing secrets are not set. Add SNIB_KEYSTORE_BASE64," \
                 "SNIB_KEYSTORE_PASSWORD, SNIB_KEY_ALIAS and SNIB_KEY_PASSWORD in the repo's" \
                 "Settings → Secrets and variables → Actions. See README → Releases."
            exit 1
          fi

      - name: Decode keystore
        run: echo "${{ secrets.SNIB_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/snib-release.jks"

      - name: Assemble signed release APK
        env:
          SNIB_KEYSTORE_PATH: ${{ runner.temp }}/snib-release.jks
          SNIB_KEYSTORE_PASSWORD: ${{ secrets.SNIB_KEYSTORE_PASSWORD }}
          SNIB_KEY_ALIAS: ${{ secrets.SNIB_KEY_ALIAS }}
          SNIB_KEY_PASSWORD: ${{ secrets.SNIB_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
