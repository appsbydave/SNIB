<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Snib" color="#B08A4A">
  <title>Snib — snibbed</title>
  <!--
    The mark is a door snib: a bar turning on a pin, set in a plate.
    Bar vertical = snibbed.  Bar horizontal = open.
    For the open state, rotate the bar group 90 degrees about (32,32).
    Colour inherits from CSS `color`; defaults to brass #B08A4A.
  -->
  <mask id="snib-bar">
    <rect x="0" y="0" width="64" height="64" fill="black"/>
    <rect x="25" y="12" width="14" height="40" rx="7" fill="white"/>
    <circle cx="32" cy="32" r="3.5" fill="black"/>
  </mask>

  <rect x="6" y="6" width="52" height="52" rx="15"
        fill="none" stroke="currentColor" stroke-width="4"/>

  <g id="bar" transform="rotate(0 32 32)">
    <rect x="0" y="0" width="64" height="64" fill="currentColor" mask="url(#snib-bar)"/>
  </g>
</svg>
